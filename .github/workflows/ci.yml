name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-on-version: '20'
        cache: 'npm'

    - name: Install Dependencies
      run: npm ci

    - name: Set up Java (Required by Firebase Emulator)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Firebase CLI
      run: npm install -g firebase-tools

    - name: Run Lint
      run: npm run lint

    - name: Run Typecheck
      run: npm run typecheck

    - name: Run Rules Tests with Emulators
      run: |
        firebase emulators:exec --only firestore "npm run test:rules"

    - name: Run Unit Tests
      run: npm run test

    - name: Build Next.js Application
      run: npm run build
      env:
        # Mock public environment variables for build safety
        NEXT_PUBLIC_FIREBASE_API_KEY: "mock-api-key"
        NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: "mock-project.firebaseapp.com"
        NEXT_PUBLIC_FIREBASE_PROJECT_ID: "mock-project"
